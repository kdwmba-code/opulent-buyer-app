<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opulent Buyer Journey</title>
<style>
  :root{
    --black:#0a0a0a;
    --green:#2BBE6E;
    --green-dim:#1e8f52;
    --white:#ffffff;
    --grey:#9a9a9a;
    --card:#161616;
    --card2:#1f1f1f;
    --danger:#e05252;
    --warn:#e0b34d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--black);
    color:var(--white);
    font-family:'Josefin Sans', 'Space Grotesk', Segoe UI, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{
    font-family:'Cinzel', Georgia, serif;
    letter-spacing:0.5px;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--black);
    display:flex;
    flex-direction:column;
    position:relative;
    border-left:1px solid #222;
    border-right:1px solid #222;
  }
  header.topbar{
    padding:18px 16px 14px;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    background:var(--black);
    z-index:10;
  }
  header.topbar .brand{
    color:var(--green);
    font-size:15px;
    text-transform:uppercase;
  }
  header.topbar h1{
    font-size:19px;
    margin:2px 0 0;
    color:var(--white);
    font-weight:600;
  }
  .backbtn{
    background:none;
    border:1px solid #333;
    color:var(--white);
    border-radius:8px;
    padding:6px 10px;
    font-size:13px;
    cursor:pointer;
  }
  main{
    flex:1;
    padding:16px;
    padding-bottom:90px;
    overflow-y:auto;
  }
  nav.bottomnav{
    position:sticky;
    bottom:0;
    background:#0d0d0d;
    border-top:1px solid #222;
    display:flex;
    justify-content:space-around;
    padding:8px 4px 10px;
    z-index:10;
  }
  nav.bottomnav button{
    background:none;
    border:none;
    color:var(--grey);
    font-size:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    cursor:pointer;
    font-family:'Josefin Sans',sans-serif;
    padding:2px 4px;
  }
  nav.bottomnav button .ic{font-size:18px;}
  nav.bottomnav button.active{color:var(--green);}
  .card{
    background:var(--card);
    border:1px solid #262626;
    border-radius:14px;
    padding:14px;
    margin-bottom:14px;
  }
  .card h3{margin:0 0 8px;font-size:15px;color:var(--white);}
  .muted{color:var(--grey);font-size:12.5px;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .btn{
    background:var(--green);
    color:#06210f;
    border:none;
    border-radius:10px;
    padding:11px 14px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    font-family:'Josefin Sans',sans-serif;
    width:100%;
  }
  .btn.secondary{
    background:transparent;
    color:var(--green);
    border:1px solid var(--green-dim);
  }
  .btn.ghost{
    background:transparent;
    color:var(--white);
    border:1px solid #333;
  }
  .btn.small{width:auto;padding:7px 10px;font-size:12px;}
  .btn.danger{background:var(--danger);color:#fff;}
  input,textarea,select{
    width:100%;
    background:#0f0f0f;
    border:1px solid #2a2a2a;
    color:var(--white);
    border-radius:8px;
    padding:10px;
    font-size:14px;
    font-family:'Josefin Sans',sans-serif;
    margin-bottom:10px;
  }
  label{font-size:12px;color:var(--grey);display:block;margin-bottom:4px;}
  .pill{
    display:inline-block;
    padding:3px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
    margin:2px 4px 2px 0;
  }
  .pill.pro{background:rgba(43,190,110,0.15);color:var(--green);border:1px solid var(--green-dim);}
  .pill.con{background:rgba(224,82,82,0.15);color:var(--danger);border:1px solid #6b2727;}
  .chip{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    border:1px solid #333;
    color:var(--grey);
    margin:3px 4px 3px 0;
    cursor:pointer;
    background:#111;
  }
  .chip.selected{background:var(--green);color:#06210f;border-color:var(--green);font-weight:600;}
  .score-badge{
    width:44px;height:44px;border-radius:50%;
    background:var(--green);color:#06210f;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px;flex-shrink:0;
    font-family:'Space Grotesk',sans-serif;
  }
  .score-badge.empty{background:#222;color:var(--grey);}
  .thumb-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0;}
  .thumb{
    width:74px;height:74px;border-radius:10px;object-fit:cover;
    border:1px solid #262626;flex-shrink:0;background:#111;
  }
  .home-row{
    display:flex;gap:12px;align-items:center;
    padding:10px 0;border-bottom:1px solid #1e1e1e;cursor:pointer;
  }
  .home-row:last-child{border-bottom:none;}
  .home-row img.thumb{width:56px;height:56px;}
  .home-row .info{flex:1;min-width:0;}
  .home-row .addr{font-size:14px;font-weight:600;}
  .home-row .sub{font-size:12px;color:var(--grey);}
  .status-track{display:flex;gap:4px;margin:10px 0;}
  .status-track .seg{flex:1;height:6px;border-radius:3px;background:#252525;}
  .status-track .seg.done{background:var(--green);}
  .status-track .seg.current{background:var(--warn);}
  .empty-state{text-align:center;padding:40px 12px;color:var(--grey);}
  .empty-state .ic{font-size:34px;margin-bottom:10px;}
  .slider-wrap{display:flex;align-items:center;gap:12px;}
  input[type=range]{
    -webkit-appearance:none;height:6px;border-radius:3px;
    background:linear-gradient(90deg,var(--green) 0%,var(--green) var(--pct,50%),#262626 var(--pct,50%),#262626 100%);
    margin-bottom:0;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:var(--white);border:3px solid var(--green);cursor:pointer;
  }
  .toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1e1e1e;}
  .switch{
    width:42px;height:24px;background:#2a2a2a;border-radius:20px;position:relative;cursor:pointer;flex-shrink:0;
  }
  .switch.on{background:var(--green);}
  .switch .knob{
    width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.15s;
  }
  .switch.on .knob{left:21px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .compare-grid{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .compare-col{
    min-width:180px;background:var(--card2);border-radius:12px;padding:10px;border:1px solid #262626;
  }
  .compare-col img{width:100%;height:100px;object-fit:cover;border-radius:8px;margin-bottom:6px;}
  .compare-col .lbl{font-size:10px;color:var(--grey);text-transform:uppercase;margin-top:8px;}
  .compare-col .val{font-size:13px;font-weight:600;}
  .fav-rank{
    display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1e1e1e;
  }
  .fav-rank .num{
    width:26px;height:26px;border-radius:50%;background:#222;color:var(--green);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;
  }
  .fav-rank .arrows{display:flex;flex-direction:column;gap:2px;}
  .fav-rank .arrows button{background:none;border:none;color:var(--grey);cursor:pointer;font-size:12px;padding:2px;}
  .voice-item{
    display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:10px;padding:10px;margin-bottom:8px;
  }
  .voice-item .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .doc-item{
    display:flex;align-items:center;justify-content:space-between;background:var(--card2);
    border-radius:10px;padding:10px 12px;margin-bottom:8px;
  }
  .tabbar{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid #222;}
  .tabbar button{
    background:none;border:none;color:var(--grey);padding:10px 4px;font-size:13px;cursor:pointer;
    border-bottom:2px solid transparent;font-family:'Josefin Sans',sans-serif;
  }
  .tabbar button.active{color:var(--green);border-color:var(--green);font-weight:600;}
  .fab{
    position:fixed;
    bottom:96px;
    right:calc(50% - 240px + 16px);
    width:52px;height:52px;border-radius:50%;
    background:var(--green);color:#06210f;border:none;
    font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.5);cursor:pointer;
    display:flex;align-items:center;justify-content:center;z-index:20;
  }
  @media (max-width:520px){
    .fab{right:16px;}
  }
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal{
    background:#111;border-top-left-radius:18px;border-top-right-radius:18px;
    padding:20px 16px 26px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;
    border-top:1px solid #2a2a2a;
  }
  .modal h3{margin-top:0;}
  .closex{float:right;background:none;border:none;color:var(--grey);font-size:20px;cursor:pointer;}
  .banner-share{
    background:linear-gradient(135deg,rgba(43,190,110,.15),rgba(43,190,110,.03));
    border:1px solid var(--green-dim);border-radius:12px;padding:12px 14px;margin-bottom:14px;
    font-size:12.5px;
  }
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:3px;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <div class="brand">OPULENT REALTY GROUP <span id="syncDot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#666;margin-left:4px;"></span></div>
      <h1 id="pageTitle">Dashboard</h1>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="backbtn" id="backBtn" style="display:none">← Back</button>
      <button class="backbtn" id="agentModeBtn" style="border-color:#333;">Agent Mode: Off</button>
    </div>
  </header>
  <main id="main"></main>
  <button class="fab" id="fab" style="display:none">+</button>
  <nav class="bottomnav">
    <button data-view="dashboard"><span class="ic">🏠</span>Home</button>
    <button data-view="schedule"><span class="ic">📅</span>Tours</button>
    <button data-view="favorites"><span class="ic">⭐</span>Favorites</button>
    <button data-view="compare"><span class="ic">⚖️</span>Compare</button>
    <button data-view="agent"><span class="ic">🤝</span>Agent</button>
  </nav>
</div>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ============ DATA LAYER (Supabase-backed, real-time synced) ============ */
const SUPABASE_URL = 'https://oiszuqcimrciypmuzkdt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pFtPwv81osfU119QgAJnPQ_0mwkEH85';
const ROW_ID = 'thornton-tour';
const DB_KEY = 'opulent_buyer_app_v2'; // used only as an offline fallback cache

let sb = null;
try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.warn('Supabase client failed to init', e); }

let syncStatus = 'connecting'; // connecting | live | offline

function seedDB(){
  const seed = {
    // NOTE: no client PII is hardcoded here on purpose — this file is publicly hosted.
    // Real buyer/partner contact info is seeded directly into Supabase (see setup SQL) and
    // loaded at runtime, never shipped in this source.
    profile:{
      buyerName:'', buyerEmail:'', buyerPhone:'',
      partnerName:'', partnerEmail:'', partnerPhone:'',
      agentName:'Keenan D. Washington, Sr.', agentEmail:'kdwmba@gmail.com'
    },
    // Buyer's financing profile, from their preapproval. Agent-editable only. Blank until set —
    // no cost estimate is shown anywhere until this is filled in.
    financing:{ loanType:'', downPaymentPct:null, interestRate:null, loanTermYears:30 },
    properties: [
      {
        id:'p1', address:'7931 Jenkintown Rd', city:'Cheltenham, PA 19012', price:549900, beds:4, baths:3.5, sqft:2494, mls:'PAMC2175360', annualTax:11548,
        priorPrice:565000, priceAsOf:'2026-08-05', dataAsOf:'2026-08-05',
        showingDate:'2026-08-06T15:45', durationMinutes:15, checkedIn:false,
        photos:[], subScores:{}, ratings:{}, prosCons:[], voiceNotes:[],
        favorite:false, rank:null, videoLink:'', guests:[],
        offerStatus:null, offerHistory:[], offerTerms:{}, documents:[], agentNotes:'', sharedWithAgent:false
      },
      {
        id:'p2', address:'349 Rettop Place', city:'Warminster, PA 18974', price:549900, beds:5, baths:2.5, sqft:1887, mls:'PABU2127928', annualTax:6338,
        priorPrice:null, priceAsOf:'2026-08-05', dataAsOf:'2026-08-05',
        showingDate:'2026-08-06T16:30', durationMinutes:15, checkedIn:false,
        photos:[], subScores:{}, ratings:{}, prosCons:[], voiceNotes:[],
        favorite:false, rank:null, videoLink:'', guests:[],
        offerStatus:null, offerHistory:[], offerTerms:{}, documents:[], agentNotes:'', sharedWithAgent:false
      },
      {
        id:'p3', address:'1008 Pioneer Rd', city:'Lansdale, PA 19446', price:499000, beds:4, baths:2, sqft:1741, mls:'PAMC2187718', annualTax:5093,
        priorPrice:null, priceAsOf:'2026-08-05', dataAsOf:'2026-08-05',
        showingDate:'2026-08-06T17:15', durationMinutes:null, checkedIn:false,
        photos:[], subScores:{}, ratings:{}, prosCons:[], voiceNotes:[],
        favorite:false, rank:null, videoLink:'', guests:[],
        offerStatus:null, offerHistory:[], offerTerms:{}, documents:[], agentNotes:'', sharedWithAgent:false
      }
    ]
  };
  return seed;
}

// Real MLS tax figures as of this build, used as a fallback for rows that predate this field
// (e.g. already-seeded Supabase rows) so nobody has to re-run SQL to get accurate numbers.
const KNOWN_TAX = { p1: 11548, p2: 6338, p3: 5093 };
const KNOWN_PRICE = { p1: 549900 }; // Jenkintown Rd price-dropped after the row was first seeded
// Backfill for price-change tracking and the "data pulled on" disclaimer, so already-seeded
// Supabase rows pick these up automatically without re-running setup SQL.
const KNOWN_PRICE_META = {
  p1: { priorPrice:565000, priceAsOf:'2026-08-05', dataAsOf:'2026-08-05' },
  p2: { priorPrice:null,   priceAsOf:'2026-08-05', dataAsOf:'2026-08-05' },
  p3: { priorPrice:null,   priceAsOf:'2026-08-05', dataAsOf:'2026-08-05' }
};

let DB = null;

function normalizeDB(){
  if(!DB) return;
  if(!DB.financing) DB.financing = { loanType:'', downPaymentPct:null, interestRate:null, loanTermYears:30 };
  (DB.properties||[]).forEach(p=>{
    if((p.annualTax==null) && KNOWN_TAX[p.id]!=null) p.annualTax = KNOWN_TAX[p.id];
    // One-time correction for rows already saved to Supabase with the stale price they were
    // first seeded with (e.g. p1 was originally saved at $599,900 before the real price-drop
    // to $549,900 was known). Applies once via the flag so it never overwrites a price an
    // agent deliberately edits afterward.
    if(!p.priceCorrected && KNOWN_PRICE[p.id]!=null && p.price !== KNOWN_PRICE[p.id]){
      p.price = KNOWN_PRICE[p.id];
    }
    if(!p.priceCorrected) p.priceCorrected = true;
    if(p.videoLink===undefined) p.videoLink = '';
    if(!p.guests) p.guests = [];
    const meta = KNOWN_PRICE_META[p.id];
    if(meta){
      if(p.priorPrice===undefined) p.priorPrice = meta.priorPrice;
      if(!p.priceAsOf) p.priceAsOf = meta.priceAsOf;
      if(!p.dataAsOf) p.dataAsOf = meta.dataAsOf;
    }
  });
}

async function initDB(){
  // offline-first: paint immediately from local cache (or seed) while we reach out to Supabase
  const cached = localStorage.getItem(DB_KEY);
  DB = cached ? JSON.parse(cached) : seedDB();
  normalizeDB();
  render();

  if(!sb) return;
  try{
    const { data, error } = await sb.from('buyer_app_state').select('data').eq('id', ROW_ID).maybeSingle();
    if(error) throw error;
    if(data && data.data){
      DB = data.data;
      normalizeDB();
    } else {
      // no shared row yet — create it from our seed/cache so every device converges on the same state
      const { error: insertErr } = await sb.from('buyer_app_state').insert({ id: ROW_ID, data: DB });
      if(insertErr) throw insertErr;
    }
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    syncStatus = 'live';
    subscribeRealtime();
  } catch(e){
    console.warn('Supabase unavailable, staying in offline mode', e);
    syncStatus = 'offline';
  }
  render();
}

function subscribeRealtime(){
  if(!sb) return;
  sb.channel('buyer_app_state_changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'buyer_app_state', filter:`id=eq.${ROW_ID}` }, (payload)=>{
      if(payload.new && payload.new.data){
        DB = payload.new.data;
        normalizeDB();
        localStorage.setItem(DB_KEY, JSON.stringify(DB));
        render();
      }
    })
    .subscribe((status)=>{
      syncStatus = (status === 'SUBSCRIBED') ? 'live' : syncStatus;
      render();
    });
}

function save(){
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  if(sb){
    sb.from('buyer_app_state')
      .update({ data: DB, updated_at: new Date().toISOString() })
      .eq('id', ROW_ID)
      .then(({error})=>{ if(error){ console.warn('Sync failed, saved locally only', error); syncStatus='offline'; render(); } });
  }
}
function getProp(id){ return DB.properties.find(p=>p.id===id); }
function uid(){ return 'p'+Math.random().toString(36).slice(2,9); }

/* ============ ROUTER ============ */
let state = { view:'dashboard', propId:null, compareIds:[], agentMode:false, guestMode:false, guestId:null, guestShowingId:null };

function go(view, opts={}){
  state.view = view;
  Object.assign(state, opts);
  render();
}

// A ?guest=1 link (optionally with &showing=<id>) puts this browser into a stripped-down,
// single-purpose guest flow instead of the normal buyer app — used for the up-to-4 remote
// guests invited to a virtual tour. Rejoining the same link after a reload/refresh skips
// straight back to their rating screen via the guestId/guestShowingId saved locally.
function initGuestModeFromURL(){
  const params = new URLSearchParams(location.search);
  if(params.get('guest') !== '1') return;
  state.guestMode = true;
  state.guestShowingId = params.get('showing') || localStorage.getItem('guestShowingId') || null;
  state.guestId = localStorage.getItem('guestId') || null;
}

document.querySelectorAll('.bottomnav button').forEach(btn=>{
  btn.addEventListener('click', ()=> go(btn.dataset.view));
});
document.getElementById('backBtn').addEventListener('click', ()=> go('dashboard'));
document.getElementById('agentModeBtn').addEventListener('click', ()=>{
  state.agentMode = !state.agentMode;
  render();
});

/* ============ HELPERS ============ */
function fmtPrice(n){ return n ? '$'+n.toLocaleString() : '—'; }
function fmtDateShort(iso){
  if(!iso) return '';
  const dt = new Date(iso+'T00:00:00');
  if(isNaN(dt)) return '';
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
// Small up/down arrow badge next to a price, shown only when we know the prior list price differed.
function priceChangeHTML(p){
  if(p.priorPrice==null || p.price==null || p.priorPrice===p.price) return '';
  const down = p.price < p.priorPrice;
  const diff = Math.abs(p.price - p.priorPrice);
  const arrow = down ? '▼' : '▲';
  const color = down ? 'var(--green)' : 'var(--danger)';
  const asOf = p.priceAsOf ? ` (${fmtDateShort(p.priceAsOf)})` : '';
  return ` <span style="color:${color};font-weight:700;font-size:12px;" title="Price ${down?'dropped':'increased'} ${fmtPrice(diff)} from ${fmtPrice(p.priorPrice)}${asOf}">${arrow} ${fmtPrice(diff)}${asOf}</span>`;
}
// "Data pulled on" disclaimer — reminds everyone that price/tax/status can move between the pull and the tour.
function dataAsOfHTML(p){
  if(!p.dataAsOf) return '';
  return `<div class="muted" style="font-size:11px;margin-top:4px;">Listing data pulled ${fmtDateShort(p.dataAsOf)} — confirm current price and status with your agent before writing an offer.</div>`;
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' + dt.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function fmtShowing(p){
  return fmtDate(p.showingDate) + (p.durationMinutes ? ' (' + p.durationMinutes + ' min)' : '');
}
function scoreColor(s){ return s>=8?'var(--green)': s>=5?'var(--warn)':'var(--danger)'; }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

/* ============ MAPS / DIRECTIONS / TRAVEL TIME ============ */
function fullAddr(p){ return `${p.address}, ${p.city||''}`.trim().replace(/,\s*$/,''); }
function isIOS(){ return /iPhone|iPad|iPod/i.test(navigator.userAgent); }
function mapsUrlFor(p){
  const q = encodeURIComponent(fullAddr(p));
  return isIOS() ? `https://maps.apple.com/?daddr=${q}` : `https://www.google.com/maps/dir/?api=1&destination=${q}`;
}
function directionsUrlBetween(fromP, toP){
  const o = encodeURIComponent(fullAddr(fromP)), d = encodeURIComponent(fullAddr(toP));
  return isIOS() ? `https://maps.apple.com/?saddr=${o}&daddr=${d}` : `https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${d}`;
}
function openMaps(id){

// Rough straight-line drive-time estimate (geocoded once via OpenStreetMap, cached on the property).
// This is NOT live-traffic accurate — it's a ballpark so you can eyeball your day. Tap "Directions" for the real ETA.
const AVG_SPEED_MPH = 27; // suburban PA heuristic: accounts for lights/turns, not highway cruising
function haversineMiles(lat1, lon1, lat2, lon2){
  const R = 3958.8;
  const dLat = (lat2-lat1) * Math.PI/180, dLon = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
async function geocode(p){
  if(p.lat && p.lng) return { lat:p.lat, lng:p.lng };
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(fullAddr(p))}`);
    const rows = await res.json();
    if(rows && rows[0]){
      p.lat = parseFloat(rows[0].lat); p.lng = parseFloat(rows[0].lon);
      save();
      return { lat:p.lat, lng:p.lng };
    }
  } catch(e){ console.warn('geocode failed', e); }
  return null;
}
async function estimateTravel(fromP, toP){
  const a = await geocode(fromP), b = await geocode(toP);
  if(!a || !b) return null;
  const miles = haversineMiles(a.lat, a.lng, b.lat, b.lng);
  const minutes = Math.round((miles / AVG_SPEED_MPH) * 60);
  return { miles: miles.toFixed(1), minutes };
}

/* ============ "TIME LEFT AT THIS HOME" COUNTDOWN ============ */
// "Currently at" a home = checked in, not cancelled, and the next showing on the schedule
// hasn't been checked into yet — that's what makes the badge disappear once the group moves on,
// without needing a separate explicit "check out" step.
function isCurrentlyAt(p){
  if(!p || !p.checkedIn || p.cancelled) return false;
  const active = [...DB.properties].filter(x=>!x.cancelled).sort((a,b)=> new Date(a.showingDate)-new Date(b.showingDate));
  const idx = active.findIndex(x=>x.id===p.id);
  const next = idx>=0 ? active[idx+1] : null;
  return !next || !next.checkedIn;
}
function nextActiveShowing(p){
  const active = [...DB.properties].filter(x=>!x.cancelled).sort((a,b)=> new Date(a.showingDate)-new Date(b.showingDate));
  const idx = active.findIndex(x=>x.id===p.id);
  return idx>=0 ? active[idx+1] : null;
}
// Leave-by time = next showing's scheduled start minus the estimated drive time between here and there.
function leaveByInfo(p){
  const next = nextActiveShowing(p);
  if(!next || !next.showingDate) return null;
  const key = `${p.id}_${next.id}`;
  const travel = travelCache[key];
  const travelMinutes = travel ? travel.minutes : 12; // rough buffer until the real estimate resolves
  const leaveBy = new Date(new Date(next.showingDate).getTime() - travelMinutes*60000);
  return { next, leaveBy, travelMinutes, hasEstimate: !!travel };
}
function fmtCountdown(ms){
  const overdue = ms < 0;
  const abs = Math.abs(ms);
  const mins = Math.round(abs/60000);
  const h = Math.floor(mins/60), m = mins%60;
  const txt = h>0 ? `${h}h ${m}m` : `${m} min`;
  return overdue ? `${txt} over` : txt;
}
// Renders the badge shell; the live countdown text itself is filled in/refreshed by
// updateAllTimerBadges() on an interval, so the schedule/dashboard don't need a full re-render every tick.
function timerBadgeHTML(p){
  if(!isCurrentlyAt(p)) return '';
  const info = leaveByInfo(p);
  if(!info){
    return `<div class="muted" style="font-size:12px;margin-top:4px;">🏁 Last showing of the day — no more stops after this one.</div>`;
  }
  return `<div class="timer-badge" data-leaveby="${info.leaveBy.toISOString()}" data-nextaddr="${fullAddr(info.next).replace(/"/g,'&quot;')}" style="font-size:12px;font-weight:700;margin-top:4px;"></div>`;
}
function updateAllTimerBadges(){
  document.querySelectorAll('.timer-badge[data-leaveby]').forEach(node=>{
    const leaveBy = new Date(node.dataset.leaveby);
    const diff = leaveBy - new Date();
    const addr = node.dataset.nextaddr || 'next showing';
    if(diff < 0){
      node.style.color = 'var(--danger)';
      node.textContent = `⏰ Leave now — ${fmtCountdown(diff)} to reach ${addr}`;
    } else if(diff < 5*60000){
      node.style.color = 'var(--danger)';
      node.textContent = `⏰ Leave in ${fmtCountdown(diff)} to reach ${addr}`;
    } else if(diff < 15*60000){
      node.style.color = 'var(--warn)';
      node.textContent = `⏱ Leave in ${fmtCountdown(diff)} to reach ${addr}`;
    } else {
      node.style.color = 'var(--green)';
      node.textContent = `⏱ ${fmtCountdown(diff)} left before you should head to ${addr}`;
    }
  });
}

/* ============ ESTIMATED MONTHLY COST (mortgage + taxes + insurance) ============ */
// Rough estimates for comparison purposes only — NOT a loan quote. Actual payment depends on the
// buyer's final locked rate, lender fees, escrow requirements, and actual insurance quote.
const INSURANCE_RATE_ANNUAL = 0.0035; // ~0.35% of price/yr — typical PA homeowners insurance ballpark
const PMI_RATE_ANNUAL = 0.0075;       // ~0.75% of loan/yr — typical conventional PMI when <20% down
const FHA_MIP_RATE_ANNUAL = 0.0055;   // ~0.55% of loan/yr — current FHA annual MIP ballpark

function estimateMonthly(p){
  const f = DB.financing;
  if(!f || !f.loanType || !p.price) return null;
  const price = p.price;
  const isCash = f.loanType === 'Cash';
  const downPct = isCash ? 100 : (f.downPaymentPct != null ? f.downPaymentPct : 0);
  const loanAmount = price * (1 - downPct/100);

  let piMonthly = 0;
  if(!isCash){
    if(!f.interestRate) return null; // financing selected but rate not set yet
    const r = (f.interestRate/100)/12;
    const n = (f.loanTermYears||30) * 12;
    piMonthly = r === 0 ? loanAmount/n : loanAmount * (r*Math.pow(1+r,n)) / (Math.pow(1+r,n)-1);
  }

  const taxMonthly = (p.annualTax != null ? p.annualTax : price * 0.014) / 12; // ~1.4% fallback if unknown
  const insMonthly = (price * INSURANCE_RATE_ANNUAL) / 12;

  let miMonthly = 0;
  if(!isCash && f.loanType === 'Conventional' && downPct < 20) miMonthly = (loanAmount * PMI_RATE_ANNUAL) / 12;
  if(!isCash && f.loanType === 'FHA') miMonthly = (loanAmount * FHA_MIP_RATE_ANNUAL) / 12;

  const total = piMonthly + taxMonthly + insMonthly + miMonthly;
  return { piMonthly, taxMonthly, insMonthly, miMonthly, total, loanAmount, downPct };
}

function fmtMonthly(n){ return '$' + Math.round(n).toLocaleString(); }

  // resolve any uncached travel estimates in the background, then re-render just this view
  main.querySelectorAll('[data-travel]').forEach(node=>{

    estimateTravel(fromP, toP).then(result=>{
      if(result){ travelCache[key] = result; if(state.view==='schedule') render(); }
    });
  });

      <div class="row" style="align-items:flex-start;">
        <div>
          <div style="display:flex;align-items:center;gap:8px;">
            <h3 style="margin-bottom:2px;cursor:pointer;" id="addrHeading" title="Open in Maps">${fullAddr(p)}</h3>
            <button id="copyAddrBtn" title="Copy address" style="background:none;border:none;color:var(--grey);cursor:pointer;font-size:15px;padding:0;margin-bottom:2px;">📋</button>
          </div>
          <div class="muted">${fmtPrice(p.price)}${priceChangeHTML(p)} · ${p.beds||'–'}bd/${p.baths||'–'}ba · ${p.sqft?p.sqft.toLocaleString():'–'} sqft</div>
          <div class="muted">MLS# ${p.mls||'—'} · ${fmtShowing(p)} ${p.cancelled?'· <span style="color:var(--danger)">Cancelled</span>':''}</div>
          ${timerBadgeHTML(p)}
          ${dataAsOfHTML(p)}
          ${groupRatingHTML(p)}
        </div>
        <div class="score-badge ${p.ratings.primary?'':'empty'}" style="${p.ratings.primary?`background:${scoreColor(p.ratings.primary)};color:#06210f;`:''}">${p.ratings.primary||'–'}</div>
      </div>
      ${state.agentMode ? `
        <div class="row" style="margin-top:10px;">
          ${!p.cancelled ? `<button class="btn ghost small" id="editTimeBtn">Edit Appointment Time</button>` : ''}
          ${p.checkedIn && !p.cancelled ? `<button class="btn ghost small" id="undoCheckInBtn">Undo Check-In</button>` : ''}
          ${p.cancelled
            ? `<button class="btn secondary small" id="restoreBtn">Restore Showing</button>`
            : `<button class="btn danger small" id="cancelBtn">Cancel Showing</button>`}
        </div>
      ` : ''}
    </div>
  `));

  main.appendChild(el(remoteGuestsCardHTML(p)));
  bindRemoteGuestsCard(main, p.id);

  // Estimated monthly cost
  const est = estimateMonthly(p);
  if(est){
    main.appendChild(el(`
      <div class="card">
        <h3>Estimated Monthly Cost <span style="color:var(--green);">~${fmtMonthly(est.total)}/mo</span></h3>
        <div class="grid2">
          <div><div class="muted">Principal & Interest</div><div>${fmtMonthly(est.piMonthly)}</div></div>
          <div><div class="muted">Property Tax</div><div>${fmtMonthly(est.taxMonthly)}</div></div>
          <div><div class="muted">Homeowners Insurance</div><div>${fmtMonthly(est.insMonthly)}</div></div>
          ${est.miMonthly ? `<div><div class="muted">${DB.financing.loanType==='FHA'?'MIP':'PMI'}</div><div>${fmtMonthly(est.miMonthly)}</div></div>` : ''}
        </div>
        <div class="muted" style="margin-top:10px;">Based on ${DB.financing.loanType}${DB.financing.loanType!=='Cash' ? `, ${est.downPct}% down, ${DB.financing.interestRate}% rate` : ''}. Estimate only — not a loan quote.</div>
      </div>
    `));
  } else if(state.agentMode) {
    main.appendChild(el(`<div class="card"><h3>Estimated Monthly Cost</h3><div class="muted">Set the buyer's financing info on the Agent tab to show a monthly cost estimate here.</div></div>`));
  }

  // Photos
  main.appendChild(el(`
    <div class="card">
      <h3>Photos & Video</h3>
      <div class="thumb-row" id="photoRow">
        ${(p.photos||[]).map(src=>`<img class="thumb" src="${src}">`).join('')}
        <label class="thumb" style="display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px dashed #333;font-size:22px;color:var(--green);">
          +
          <input type="file" accept="image/*,video/*" multiple style="display:none" id="photoInput">
        </label>
      </div>
    </div>
  `));

  // Agent-only touring notes (never rendered unless Agent Mode is on — simulates agent-only visibility)
  if(state.agentMode){
    main.appendChild(el(`
      <div class="card" style="border-color:var(--green-dim);">
        <h3>🔒 Agent-Only Touring Notes</h3>
        <div class="muted" style="margin-bottom:8px;">Never visible to the buyer. For your own reference — condition notes, seller agent conversations, strategy, etc.</div>
        <textarea id="agentNotes" rows="4" placeholder="e.g. Seller motivated, will consider offers below list...">${p.agentNotes||''}</textarea>
        <button class="btn secondary" id="saveAgentNotes">Save Notes</button>
      </div>
    `));
  }

  // Rating
  main.appendChild(el(`
    <div class="card">
      <h3>Your Rating</h3>
      <div class="slider-wrap">
        <input type="range" min="1" max="10" value="${p.ratings.primary||5}" id="ratingSlider" style="--pct:${((p.ratings.primary||5)-1)/9*100}%">
        <div class="score-badge" id="ratingBadge" style="background:${scoreColor(p.ratings.primary||5)};color:#06210f;">${p.ratings.primary||5}</div>
      </div>
      <div class="muted" style="margin-top:6px;">Gut reaction, 1–10. Locks in once submitted — you can still revise later.</div>
      <div style="margin-top:10px;">
        ${['location','condition','layout','light','value'].map(k=>`
          <div class="row" style="align-items:center;margin-bottom:6px;">
            <div style="flex:0 0 90px;font-size:12px;text-transform:capitalize;color:var(--grey);">${k}</div>
            <input type="range" min="1" max="10" value="${p.subScores[k]||5}" data-sub="${k}" style="--pct:${((p.subScores[k]||5)-1)/9*100}%">
          </div>`).join('')}
      </div>
      <button class="btn" id="saveRating" style="margin-top:8px;">Save Rating</button>
      ${p.ratings.partner ? `<div class="muted" style="margin-top:10px;">Partner rating: <strong style="color:var(--white)">${p.ratings.partner}/10</strong></div>` : `<button class="btn secondary" id="addPartnerRating" style="margin-top:10px;">+ Add Partner Rating</button>`}
    </div>
  `));

  // Pros/Cons — pro and con chip-pickers and the saved list are each split into their own
  // clearly labeled group so pros and cons never blur together in one mixed row.
  main.appendChild(el((()=>{
    const indexed = p.prosCons.map((pc,i)=>({ ...pc, i }));
    const prosList = indexed.filter(x=>x.type==='pro');
    const consList = indexed.filter(x=>x.type==='con');
    const pillsHTML = list => list.length
      ? list.map(x=>`<span class="pill ${x.type}">${x.text} <span data-rm="${x.i}" style="cursor:pointer;">✕</span></span>`).join('')
      : `<div class="muted" style="font-size:12px;">None added yet.</div>`;
    return `
    <div class="card">
      <h3>Pros & Cons</h3>
      <div class="muted" style="margin-bottom:10px;">Tap to add, or type your own below.</div>

      <div style="font-size:11px;font-weight:700;letter-spacing:0.5px;color:var(--green);margin-bottom:5px;">✓ PROS</div>
      <div style="margin-bottom:14px;">
        ${PRO_CHIPS.map(c=>`<span class="chip pro-chip ${p.prosCons.some(pc=>pc.type==='pro'&&pc.text===c)?'selected':''}" data-text="${c}">${c}</span>`).join('')}
      </div>

      <div style="font-size:11px;font-weight:700;letter-spacing:0.5px;color:var(--danger);margin-bottom:5px;">✕ CONS</div>
      <div>
        ${CON_CHIPS.map(c=>`<span class="chip con-chip ${p.prosCons.some(pc=>pc.type==='con'&&pc.text===c)?'selected':''}" data-text="${c}">${c}</span>`).join('')}
      </div>

      <div class="row" style="margin-top:10px;">
        <input id="customTag" placeholder="Add your own...">
        <button class="btn small" id="addPro" style="flex:0 0 70px;">+ Pro</button>
        <button class="btn small danger" id="addCon" style="flex:0 0 70px;">+ Con</button>
      </div>

      <div style="margin-top:14px;padding-top:12px;border-top:1px solid #1e1e1e;">
        <div style="font-size:11px;font-weight:700;letter-spacing:0.5px;color:var(--green);margin-bottom:6px;">✓ PROS (${prosList.length})</div>
        <div style="margin-bottom:12px;">${pillsHTML(prosList)}</div>
        <div style="font-size:11px;font-weight:700;letter-spacing:0.5px;color:var(--danger);margin-bottom:6px;">✕ CONS (${consList.length})</div>
        <div>${pillsHTML(consList)}</div>
      </div>
    </div>`;
  })()));

  // Voice notes
  main.appendChild(el(`
    <div class="card">
      <h3>Voice Notes</h3>
      ${(p.voiceNotes||[]).map(v=>`
        <div class="voice-item"><span class="dot"></span>
          <div style="flex:1;">
            <div style="font-size:13px;font-weight:600;">${v.label}</div>
            <div class="muted">${v.transcript||'(no transcript)'}</div>
          </div>
        </div>`).join('') || `<div class="muted" style="margin-bottom:8px;">No voice notes yet.</div>`}
      <button class="btn secondary" id="addVoice">🎙️ Record Voice Note</button>
    </div>
  `));

  // Favorite / rank
  main.appendChild(el(`
    <div class="card">
      <div class="toggle">
        <div><strong>Favorite this home</strong><div class="muted">Adds it to your ranked shortlist</div></div>
        <div class="switch ${p.favorite?'on':''}" id="favSwitch"><div class="knob"></div></div>
      </div>
    </div>
  `));

  // Offer status — a single, unambiguous "select this home for an offer" action starts things
  // off, separate from the multi-stage progress tracker that only appears once an offer exists.
  const stages = ['Interested','Offer Drafted','Offer Submitted','Countered','Accepted'];
  const curIdx = p.offerStatus ? stages.indexOf(p.offerStatus) : -1;
  const isAccepted = p.offerStatus === 'Accepted';
  const nextStage = curIdx>-1 ? stages[Math.min(curIdx+1, stages.length-1)] : null;
  main.appendChild(el(`
    <div class="card" style="${!p.offerStatus ? 'border-color:var(--green-dim);' : ''}">
      <h3>Offer</h3>
      ${!p.offerStatus ? `
        <div class="muted" style="margin-bottom:10px;">No offer started on this home yet.</div>
        <button class="btn" id="selectForOffer">📝 Select This Home for an Offer</button>
      ` : `
        <div class="status-track">
          ${stages.map((s,i)=>`<div class="seg ${i<curIdx?'done':''} ${i===curIdx?'current':''}"></div>`).join('')}
        </div>
        <div style="font-weight:700;margin-top:6px;">${isAccepted ? '🎉 Offer Accepted' : p.offerStatus}</div>
        ${p.offerTerms && p.offerTerms.price ? `
          <div class="grid2" style="margin-top:10px;">
            <div><div class="muted">Offer price</div><div>${fmtPrice(p.offerTerms.price)}</div></div>
            <div><div class="muted">Close date</div><div>${p.offerTerms.closeDate||'—'}</div></div>
            <div><div class="muted">Earnest money</div><div>${fmtPrice(p.offerTerms.earnest)}</div></div>
            <div><div class="muted">Contingencies</div><div>${p.offerTerms.contingencies||'—'}</div></div>
          </div>` : ''}
        ${!isAccepted ? `<button class="btn secondary" id="advanceOffer" style="margin-top:10px;">Advance to ${nextStage} →</button>` : ''}
      `}
    </div>
  `));

  // Documents
  main.appendChild(el(`
    <div class="card">
      <h3>Disclosures & Documents</h3>
      ${(p.documents||[]).map(d=>`
        <div class="doc-item">
          <div>📄 ${d.name}<div class="muted">${d.type} · added by ${d.addedBy||'Agent'}</div></div>
          ${d.data ? `<a class="btn small ghost" href="${d.data}" download="${d.name}" style="width:auto;">Download</a>` : `<span class="muted">no file</span>`}
        </div>`).join('') || `<div class="muted" style="margin-bottom:8px;">No documents uploaded yet.</div>`}
      ${state.agentMode ? `
        <label style="margin-top:6px;">Document type</label>
        <select id="docType">
          <option>Disclosure</option>
          <option>Inspection Report</option>
          <option>Appraisal</option>
          <option>Other</option>
        </select>
        <label class="btn ghost" style="display:block;text-align:center;cursor:pointer;">
          + Upload Document
          <input type="file" id="docInput" style="display:none">
        </label>
      ` : `<div class="muted" style="margin-top:8px;">Only ${DB.profile.agentName} can upload documents here. Anything they add shows up for you to download.</div>`}
    </div>
  `));

  // Share with agent
  main.appendChild(el(`
    <div class="card">
      <div class="toggle" style="border:none;">
        <div><strong>Share with agent</strong><div class="muted">${DB.profile.agentName} can see this home's activity live</div></div>
        <div class="switch ${p.sharedWithAgent?'on':''}" id="shareSwitch"><div class="knob"></div></div>
      </div>
    </div>
  `));

  bindHomeEvents(main, p);
}

function bindHomeEvents(main, p){
  // edit appointment time (agent mode)
  const addrHeading = main.querySelector('#addrHeading');
  if(addrHeading) addrHeading.addEventListener('click', ()=> openMaps(p.id));
  const copyAddrBtn = main.querySelector('#copyAddrBtn');
  if(copyAddrBtn) copyAddrBtn.addEventListener('click', ()=> copyAddress(p.id));

  const editTimeBtn = main.querySelector('#editTimeBtn');
  if(editTimeBtn) editTimeBtn.addEventListener('click', ()=> openEditTime(p.id));
  const undoCheckInBtn = main.querySelector('#undoCheckInBtn');
  if(undoCheckInBtn) undoCheckInBtn.addEventListener('click', ()=> undoCheckIn(p.id));
  const cancelBtn = main.querySelector('#cancelBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=> openCancelShowing(p.id));
  const restoreBtn = main.querySelector('#restoreBtn');
  if(restoreBtn) restoreBtn.addEventListener('click', ()=> restoreShowing(p.id));

  // agent-only touring notes
  const saveAgentNotes = main.querySelector('#saveAgentNotes');
  if(saveAgentNotes) saveAgentNotes.addEventListener('click', ()=>{
    p.agentNotes = document.getElementById('agentNotes').value;
    save(); render();
  });

  // photos
  const photoInput = main.querySelector('#photoInput');
  if(photoInput) photoInput.addEventListener('change', (e)=>{
    [...e.target.files].forEach(f=>{
      const reader = new FileReader();
      reader.onload = ()=>{ p.photos.push(reader.result); save(); render(); };
      reader.readAsDataURL(f);
    });
  });

  // rating
  const slider = main.querySelector('#ratingSlider');
  const badge = main.querySelector('#ratingBadge');
  if(slider){
    slider.addEventListener('input', ()=>{
      slider.style.setProperty('--pct', ((slider.value-1)/9*100)+'%');
      badge.textContent = slider.value;
      badge.style.background = scoreColor(slider.value);
    });
  }
  main.querySelectorAll('[data-sub]').forEach(s=>{
    s.addEventListener('input', ()=> s.style.setProperty('--pct', ((s.value-1)/9*100)+'%'));
  });
  const saveBtn = main.querySelector('#saveRating');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    p.ratings.primary = Number(slider.value);
    main.querySelectorAll('[data-sub]').forEach(s=> p.subScores[s.dataset.sub] = Number(s.value));
    save(); render();
  });
  const partnerBtn = main.querySelector('#addPartnerRating');
  if(partnerBtn) partnerBtn.addEventListener('click', ()=>{
    openModal(`
      <button class="closex" onclick="closeModal()">✕</button>
      <h3>${DB.profile.partnerName}'s Rating</h3>
      <div class="muted" style="margin-bottom:10px;">Submitted independently — kept separate from the primary score until both are in.</div>
      <input type="range" min="1" max="10" value="5" id="partnerSlider">
      <button class="btn" id="savePartner">Submit</button>
    `);
    document.getElementById('savePartner').addEventListener('click', ()=>{
      p.ratings.partner = Number(document.getElementById('partnerSlider').value);
      save(); closeModal(); render();
    });
  });

  // pros/cons
  main.querySelectorAll('.pro-chip,.con-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const type = chip.classList.contains('pro-chip')?'pro':'con';
      const idx = p.prosCons.findIndex(pc=>pc.type===type && pc.text===chip.dataset.text);
      if(idx>-1) p.prosCons.splice(idx,1); else p.prosCons.push({type,text:chip.dataset.text});
      save(); render();
    });
  });
  const addPro = main.querySelector('#addPro');
  const addCon = main.querySelector('#addCon');
  const customTag = main.querySelector('#customTag');
  if(addPro) addPro.addEventListener('click', ()=>{
    if(!customTag.value.trim()) return;
    p.prosCons.push({type:'pro', text:customTag.value.trim()}); save(); render();
  });
  if(addCon) addCon.addEventListener('click', ()=>{
    if(!customTag.value.trim()) return;
    p.prosCons.push({type:'con', text:customTag.value.trim()}); save(); render();
  });
  main.querySelectorAll('[data-rm]').forEach(x=>{
    x.addEventListener('click', ()=>{ p.prosCons.splice(Number(x.dataset.rm),1); save(); render(); });
  });

  // voice notes
  const addVoice = main.querySelector('#addVoice');
  if(addVoice) addVoice.addEventListener('click', ()=>{
    openModal(`
      <button class="closex" onclick="closeModal()">✕</button>
      <h3>New Voice Note</h3>
      <div class="muted" style="margin-bottom:10px;">This prototype simulates recording — type what you'd say and we'll log it as a transcribed note.</div>
      <label>Label</label><input id="vLabel" placeholder="e.g. Kitchen walkthrough">
      <label>Transcript</label><textarea id="vText" rows="3" placeholder="Speak your note here..."></textarea>
      <div class="toggle" style="border:none;padding-top:0;">
        <div class="muted">Share with agent</div>
        <div class="switch" id="vShareSwitch"><div class="knob"></div></div>
      </div>
      <button class="btn" id="saveVoice">Save Voice Note</button>
    `);
    let vShare = false;
    document.getElementById('vShareSwitch').addEventListener('click', function(){ vShare=!vShare; this.classList.toggle('on', vShare); });
    document.getElementById('saveVoice').addEventListener('click', ()=>{
      p.voiceNotes.push({ id:uid(), label:document.getElementById('vLabel').value||'Voice note', transcript:document.getElementById('vText').value, sharedWithAgent:vShare });
      save(); closeModal(); render();
    });
  });

  // favorite
  const favSwitch = main.querySelector('#favSwitch');
  if(favSwitch) favSwitch.addEventListener('click', ()=>{
    p.favorite = !p.favorite;
    if(p.favorite && !p.rank){
      const maxRank = Math.max(0, ...DB.properties.filter(x=>x.favorite&&x.rank).map(x=>x.rank));
      p.rank = maxRank+1;
    }
    save(); render();
  });

  // offer
  const stages = ['Interested','Offer Drafted','Offer Submitted','Countered','Accepted'];
  const selectForOfferBtn = main.querySelector('#selectForOffer');
  if(selectForOfferBtn){
    selectForOfferBtn.addEventListener('click', ()=>{
      p.offerStatus = 'Offer Drafted';
      p.offerHistory.push('Interested', 'Offer Drafted');
      save(); render();
    });
  }
  const advanceBtn = main.querySelector('#advanceOffer');
  if(advanceBtn){
    advanceBtn.addEventListener('click', ()=>{
      if(p.offerStatus==='Offer Drafted'){
        openModal(`
          <button class="closex" onclick="closeModal()">✕</button>
          <h3>Offer Terms</h3>
          <label>Offer Price</label><input id="oPrice" type="number" placeholder="410000">
          <label>Close Date</label><input id="oClose" type="date">
          <label>Earnest Money</label><input id="oEarnest" type="number" placeholder="5000">
          <label>Contingencies</label><input id="oCont" placeholder="Inspection, Financing">
          <button class="btn" id="oSave">Submit Offer</button>
        `);
        document.getElementById('oSave').addEventListener('click', ()=>{
          p.offerTerms = {
            price:Number(document.getElementById('oPrice').value)||null,
            closeDate:document.getElementById('oClose').value,
            earnest:Number(document.getElementById('oEarnest').value)||null,
            contingencies:document.getElementById('oCont').value
          };
          p.offerStatus='Offer Submitted'; p.offerHistory.push('Offer Submitted');
          save(); closeModal(); render();
        });
        return;
      } else {
        const idx = stages.indexOf(p.offerStatus);
        const next = stages[Math.min(idx+1, stages.length-1)];
        p.offerStatus = next; p.offerHistory.push(next);
      }
      save(); render();
    });
  }

  // documents — upload only available in Agent Mode
  const docInput = main.querySelector('#docInput');
  if(docInput && state.agentMode) docInput.addEventListener('change', (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const docTypeSel = main.querySelector('#docType');
    const reader = new FileReader();
    reader.onload = ()=>{
      p.documents.push({
        name:f.name,
        type: docTypeSel ? docTypeSel.value : 'Other',
        addedBy: 'Agent',
        data: reader.result
      });
      save(); render();
    };
    reader.readAsDataURL(f);
  });

  // share with agent
  const shareSwitch = main.querySelector('#shareSwitch');
  if(shareSwitch) shareSwitch.addEventListener('click', ()=>{
    p.sharedWithAgent = !p.sharedWithAgent; save(); render();
  });
}

/* ============ FAVORITES ============ */
function renderFavorites(main){
  const favs = DB.properties.filter(p=>p.favorite).sort((a,b)=>(a.rank||99)-(b.rank||99));
  if(!favs.length){
    main.appendChild(el(`<div class="empty-state"><div class="ic">⭐</div>Heart a home from its detail page to add it to your ranked shortlist.</div>`));
    return;
  }
  main.appendChild(el(`<div class="card"><h3>Your Ranked Shortlist</h3><div class="muted" style="margin-bottom:8px;">Visible live to ${DB.profile.agentName}.</div>${
    favs.map((p,i)=>`
      <div class="fav-rank" data-id="${p.id}">
        <div class="num">${i+1}</div>
        <img class="thumb" style="width:48px;height:48px;" src="${thumbFor(p)}">
        <div class="info" style="flex:1;"><div class="addr">${fullAddr(p)}</div><div class="sub">${fmtPrice(p.price)}${priceChangeHTML(p)} · ${p.ratings.primary?p.ratings.primary+'/10':'unrated'}</div></div>
        <div class="arrows">
          <button data-up="${p.id}">▲</button>
          <button data-down="${p.id}">▼</button>
        </div>
      </div>`).join('')
  }</div>`));

  main.querySelectorAll('[data-up]').forEach(b=> b.addEventListener('click', ()=> moveRank(b.dataset.up,-1)));
  main.querySelectorAll('[data-down]').forEach(b=> b.addEventListener('click', ()=> moveRank(b.dataset.down,1)));
  main.querySelectorAll('.fav-rank .info').forEach(row=>{
    row.addEventListener('click', ()=> go('home',{propId: row.closest('.fav-rank').dataset.id}));
  });
}

function moveRank(id, dir){
  const favs = DB.properties.filter(p=>p.favorite).sort((a,b)=>(a.rank||99)-(b.rank||99));
  const idx = favs.findIndex(p=>p.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=favs.length) return;
  const a = favs[idx], b = favs[swapIdx];
  const tmp = a.rank; a.rank = b.rank; b.rank = tmp;
  save(); render();
}

/* ============ COMPARE ============ */
function renderCompare(main){
  const candidates = DB.properties.filter(p=>p.checkedIn && !p.cancelled);
  main.appendChild(el(`<div class="card">
    <h3>Select homes to compare</h3>
    ${candidates.map(p=>`<span class="chip ${state.compareIds.includes(p.id)?'selected':''}" data-cmp="${p.id}">${fullAddr(p)}</span>`).join('')}
  </div>`));

  main.querySelectorAll('[data-cmp]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const id = chip.dataset.cmp;
      const i = state.compareIds.indexOf(id);
      if(i>-1) state.compareIds.splice(i,1);
      else if(state.compareIds.length<4) state.compareIds.push(id);
      render();
    });
  });

  const chosen = state.compareIds.map(getProp).filter(Boolean);
  if(!chosen.length){
    main.appendChild(el(`<div class="empty-state"><div class="ic">⚖️</div>Pick 2–4 homes above to compare side by side.</div>`));
    return;
  }

  main.appendChild(el(`<div class="compare-grid">${
    chosen.map(p=>`
      <div class="compare-col">
        <img src="${thumbFor(p)}">
        <div style="font-weight:700;font-size:13px;">${fullAddr(p)}</div>
        <div class="lbl">Price</div><div class="val">${fmtPrice(p.price)}${priceChangeHTML(p)}</div>
        <div class="lbl">Est. Monthly Cost</div><div class="val" style="color:var(--green);">${estimateMonthly(p) ? '~'+fmtMonthly(estimateMonthly(p).total)+'/mo' : 'Set financing info'}</div>
        <div class="lbl"></div><div class="val">${dataAsOfHTML(p)}</div>
        <div class="lbl">Group Rating</div><div class="val">${groupRatingHTML(p) || '—'}</div>
        <div class="lbl">Beds/Baths</div><div class="val">${p.beds||'–'}bd / ${p.baths||'–'}ba</div>
        <div class="lbl">Sqft</div><div class="val">${p.sqft?p.sqft.toLocaleString():'–'}</div>
        <div class="lbl">Pros</div><div class="val">${p.prosCons.filter(x=>x.type==='pro').map(x=>x.text).join(', ')||'—'}</div>
        <div class="lbl">Cons</div><div class="val">${p.prosCons.filter(x=>x.type==='con').map(x=>x.text).join(', ')||'—'}</div>
        <div class="lbl">Offer status</div><div class="val">${p.offerStatus||'—'}</div>
      </div>
    `).join('')
  }</div>`));

  main.appendChild(el(`<button class="btn secondary" id="exportCompare" style="margin-top:14px;">Export / Share Comparison</button>`));
  main.querySelector('#exportCompare').addEventListener('click', ()=>{
    alert('In production this generates a shareable PDF of this comparison for you or your agent.');
  });
}

/* ============ AGENT SHARE ============ */
function openEditFinancing(){
  const f = DB.financing || {};
  openModal(`
    <button class="closex" onclick="closeModal()">✕</button>
    <h3>Buyer Financing</h3>
    <div class="muted" style="margin-bottom:10px;">From the preapproval letter. Drives the estimated monthly cost shown on every home.</div>
    <label>Loan Type</label>
    <select id="finType">
      <option value="">Select…</option>
      <option value="Cash" ${f.loanType==='Cash'?'selected':''}>Cash</option>
      <option value="Conventional" ${f.loanType==='Conventional'?'selected':''}>Conventional</option>
      <option value="FHA" ${f.loanType==='FHA'?'selected':''}>FHA</option>
      <option value="VA" ${f.loanType==='VA'?'selected':''}>VA</option>
    </select>
    <label>Down Payment %</label>
    <input id="finDown" type="number" step="0.5" placeholder="e.g. 5, 3.5, 20" value="${f.downPaymentPct!=null?f.downPaymentPct:''}">
    <label>Interest Rate % (from preapproval)</label>
    <input id="finRate" type="number" step="0.01" placeholder="e.g. 6.75" value="${f.interestRate!=null?f.interestRate:''}">
    <label>Loan Term (years)</label>
    <input id="finTerm" type="number" placeholder="30" value="${f.loanTermYears||30}">
    <button class="btn" id="finSave">Save Financing Info</button>
  `);
  document.getElementById('finSave').addEventListener('click', ()=>{
    const loanType = document.getElementById('finType').value;
    DB.financing = {
      loanType,
      downPaymentPct: loanType==='Cash' ? 100 : (Number(document.getElementById('finDown').value) || null),
      interestRate: loanType==='Cash' ? null : (Number(document.getElementById('finRate').value) || null),
      loanTermYears: Number(document.getElementById('finTerm').value) || 30
    };
    save(); closeModal(); render();
  });
}

function renderAgent(main){
  const shared = DB.properties.filter(p=>p.sharedWithAgent);
  main.appendChild(el(`
    <div class="banner-share">
      You're sharing live activity on <strong>${shared.length}</strong> of ${DB.properties.length} homes with
      <strong>${DB.profile.agentName}</strong>. Toggle sharing per-home from that home's detail page.
    </div>
  `));

  const f = DB.financing || {};
  main.appendChild(el(`
    <div class="card">
      <h3>Buyer Financing</h3>
      ${f.loanType ? `
        <div class="grid2">
          <div><div class="muted">Loan type</div><div>${f.loanType}</div></div>
          <div><div class="muted">Down payment</div><div>${f.loanType==='Cash' ? '100% (cash)' : (f.downPaymentPct!=null ? f.downPaymentPct+'%' : '—')}</div></div>
          <div><div class="muted">Interest rate</div><div>${f.loanType==='Cash' ? '—' : (f.interestRate!=null ? f.interestRate+'%' : 'not set')}</div></div>
          <div><div class="muted">Term</div><div>${f.loanType==='Cash' ? '—' : (f.loanTermYears||30)+' yr'}</div></div>
        </div>
      ` : `<div class="muted">Not set yet — estimated monthly costs won't show until financing is entered.</div>`}
      ${state.agentMode ? `<button class="btn secondary" id="editFinancingBtn" style="margin-top:10px;">${f.loanType?'Edit':'Set'} Financing Info</button>` : ''}
    </div>
  `));
  const editFinancingBtn = main.querySelector('#editFinancingBtn');
  if(editFinancingBtn) editFinancingBtn.addEventListener('click', openEditFinancing);

  main.appendChild(el(`<div class="card"><h3>Agent Dashboard Preview</h3>
    <div class="muted" style="margin-bottom:10px;">This is what ${DB.profile.agentName.split(' ')[0]} sees for you right now — no follow-up call needed.</div>
    ${shared.length ? shared.map(p=>`
      <div class="home-row" data-id="${p.id}">
        <img class="thumb" src="${thumbFor(p)}">
        <div class="info">
          <div class="addr">${fullAddr(p)} ${p.favorite?'⭐':''}</div>
          <div class="sub">Rating ${p.ratings.primary||'–'}/10 · ${p.offerStatus||'No offer yet'}</div>
        </div>
      </div>`).join('') : `<div class="muted">Nothing shared yet.</div>`}
  </div>`));

  bindHomeRows(main);

  main.appendChild(el(`
    <div class="card">
      <h3>Message ${DB.profile.agentName.split(' ')[0]}</h3>
      <textarea id="agentMsg" rows="3" placeholder="Ask a question or leave a note for your agent..."></textarea>
      <button class="btn" id="sendMsg">Send</button>
    </div>
  `));
  main.querySelector('#sendMsg').addEventListener('click', ()=>{
    const v = document.getElementById('agentMsg').value.trim();
    if(!v) return;
    alert('Message sent to '+DB.profile.agentName+':\n\n"'+v+'"');
    document.getElementById('agentMsg').value='';
  });
}

/* ============ VIRTUAL TOUR: REMOTE GUESTS ============ */
function guestInviteLink(p){
  const base = location.origin + location.pathname;
  return `${base}?guest=1&showing=${p.id}`;
}
function copyGuestInvite(id){
  const p = getProp(id);
  const link = guestInviteLink(p);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(()=> toast('Invite link copied — share it with up to 4 guests')).catch(()=> toast(link));
  } else {
    toast(link);
  }
}
function openSetVideoLink(id){
  const p = getProp(id);
  openModal(`
    <button class="closex" onclick="closeModal()">✕</button>
    <h3>Video Call Link</h3>
    <div class="muted" style="margin-bottom:10px;">Start a Zoom, FaceTime, or Google Meet call yourself, then paste the join link here so remote guests can tap straight into it.</div>
    <label>Join Link</label>
    <input id="videoLinkInput" placeholder="https://..." value="${p.videoLink||''}">
    <button class="btn" id="saveVideoLink" style="margin-top:10px;">Save</button>
    ${p.videoLink ? `<button class="btn ghost" id="clearVideoLink" style="margin-top:8px;">Remove Link</button>` : ''}
  `);
  document.getElementById('saveVideoLink').addEventListener('click', ()=>{
    p.videoLink = document.getElementById('videoLinkInput').value.trim();
    save(); closeModal(); render();
    toast('Video call link saved');
  });
  const clearBtn = document.getElementById('clearVideoLink');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    p.videoLink = '';
    save(); closeModal(); render();
  });
}
// "Remote Guests" card shown on Home Detail — invite link, video link, and each joined guest's rating.
// Every scored voice on a home — buyer, partner, and any remote guests — combined into one
// average with a tap-to-expand breakdown of who scored what.
function ratingBreakdown(p){
  const rows = [];
  if(p.ratings.primary!=null) rows.push({ name: DB.profile.buyerName || 'You', score: p.ratings.primary });
  if(p.ratings.partner!=null) rows.push({ name: DB.profile.partnerName || 'Partner', score: p.ratings.partner });
  (p.guests||[]).forEach(g=>{ if(g.rating!=null) rows.push({ name: g.name, score: g.rating }); });
  return rows;
}
function groupAverage(p){
  const rows = ratingBreakdown(p);
  if(!rows.length) return null;
  return Math.round((rows.reduce((s,r)=>s+r.score,0)/rows.length)*10)/10;
}
function groupRatingHTML(p){
  const rows = ratingBreakdown(p);
  if(!rows.length) return '';
  const avg = groupAverage(p);
  return `<details style="margin-top:6px;">
    <summary style="cursor:pointer;font-size:13px;font-weight:700;color:${scoreColor(avg)};">Group Rating: ${avg}/10 (${rows.length} score${rows.length>1?'s':''}) — tap to see who scored what</summary>
    <div style="margin-top:6px;">
      ${rows.map(r=>`<div class="row" style="justify-content:space-between;padding:3px 0;"><div class="muted">${r.name}</div><div style="font-weight:600;">${r.score}/10</div></div>`).join('')}
    </div>
  </details>`;
}
function remoteGuestsCardHTML(p){
  const guests = p.guests || [];
  return `<div class="card">
    <h3 style="margin:0 0 6px;">Remote Guests (${guests.length}/4)</h3>
    <div class="muted" style="margin-bottom:10px;">Invite up to 4 people to join this showing live and share their own rating — great for a spouse, parent, or friend who couldn't be here in person. Capped at 4 so the group stays manageable.</div>
    <div class="row" style="gap:8px;flex-wrap:wrap;">
      <button class="btn small ghost" id="copyGuestInviteBtn" ${guests.length>=4?'disabled':''}>🔗 Copy Guest Invite Link</button>
      <button class="btn small ghost" id="setVideoLinkBtn">${p.videoLink ? '🎥 Edit Video Link' : '🎥 Set Video Call Link'}</button>
      ${p.videoLink ? `<a class="btn small" href="${p.videoLink}" target="_blank">▶ Join Video</a>` : ''}
    </div>
    ${guests.length ? `
      <div style="margin-top:12px;">
        ${guests.map(g=>`
          <div class="row" style="justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #1e1e1e;">
            <div>${g.name}</div>
            <div class="muted" style="font-size:12px;">${g.rating!=null ? 'Rated ✓' : 'Joined — no rating yet'}</div>
          </div>
        `).join('')}
      </div>
    ` : ''}
  </div>`;
}
function bindRemoteGuestsCard(main, id){
  const copyBtn = document.getElementById('copyGuestInviteBtn');
  if(copyBtn) copyBtn.addEventListener('click', ()=> copyGuestInvite(id));
  const videoBtn = document.getElementById('setVideoLinkBtn');
  if(videoBtn) videoBtn.addEventListener('click', ()=> openSetVideoLink(id));
}

function findGuest(propId, guestId){
  const p = getProp(propId);
  if(!p) return null;
  const guest = (p.guests||[]).find(g=>g.id===guestId);
  return guest ? { p, guest } : null;
}
function submitGuestJoin(){
  const nameInput = document.getElementById('guestNameInput');
  const name = nameInput.value.trim();
  if(!name){ toast('Enter your name to join'); return; }
  let propId = state.guestShowingId;
  const sel = document.getElementById('guestShowingSelect');
  if(sel) propId = sel.value;
  const p = getProp(propId);
  if(!p){ toast('Pick a showing to join'); return; }
  if((p.guests||[]).length >= 4){ toast('This tour already has 4 remote guests joined'); return; }
  const id = 'g'+Math.random().toString(36).slice(2,9);
  p.guests = p.guests || [];
  p.guests.push({ id, name, checkedIn:true, rating:null, joinedAt:new Date().toISOString() });
  save();
  state.guestId = id;
  state.guestShowingId = propId;
  localStorage.setItem('guestId', id);
  localStorage.setItem('guestShowingId', propId);
  render();
}
function renderGuestJoinStep(main){
  const choices = [...DB.properties].filter(p=>!p.cancelled);
  const activeOne = choices.find(p=>isCurrentlyAt(p));
  main.appendChild(el(`
    <div class="card">
      <h3>Join the Virtual Tour</h3>
      <div class="muted" style="margin-bottom:10px;">Enter your name to check in and share your own reaction to the home — it counts alongside everyone else's.</div>
      <label>Your Name</label>
      <input id="guestNameInput" placeholder="e.g. Grandma Rose">
      ${!state.guestShowingId ? `
        <label style="margin-top:10px;">Which showing?</label>
        <select id="guestShowingSelect">
          ${choices.map(p=>`<option value="${p.id}" ${activeOne && p.id===activeOne.id ? 'selected':''}>${fullAddr(p)}${activeOne && p.id===activeOne.id ? ' (happening now)':''}</option>`).join('')}
        </select>
      ` : `<div class="muted" style="margin-top:10px;">Joining: <strong style="color:var(--white)">${fullAddr(getProp(state.guestShowingId))}</strong></div>`}
      <button class="btn" id="guestJoinBtn" style="margin-top:14px;">Join</button>
    </div>
  `));
  document.getElementById('guestJoinBtn').addEventListener('click', submitGuestJoin);
}
function renderGuestTourStep(main, p, guest){
  main.appendChild(el(`
    <div class="card">
      <img class="thumb" style="width:100%;height:160px;object-fit:cover;border-radius:8px;" src="${thumbFor(p)}">
      <h3 style="margin-top:10px;">${fullAddr(p)}</h3>
      <div class="muted">${fmtPrice(p.price)} · ${p.beds||'–'}bd/${p.baths||'–'}ba · ${p.sqft?p.sqft.toLocaleString():'–'} sqft</div>
      ${p.videoLink
        ? `<a class="btn" style="margin-top:10px;display:inline-block;text-decoration:none;text-align:center;" href="${p.videoLink}" target="_blank">▶ Join Video Call</a>`
        : `<div class="muted" style="margin-top:10px;">No video call link has been set yet — ask whoever invited you to add one.</div>`}
    </div>
  `));
  main.appendChild(el(`
    <div class="card">
      <h3>You're joined as ${guest.name}</h3>
      <div class="muted" style="margin-bottom:10px;">Give your honest reaction — your score counts alongside everyone else's.</div>
      <input type="range" min="1" max="10" value="${guest.rating||5}" id="guestRatingSlider" style="--pct:${((guest.rating||5)-1)/9*100}%">
      <div class="score-badge" id="guestRatingBadge" style="background:${scoreColor(guest.rating||5)};color:#06210f;">${guest.rating||5}</div>
      <button class="btn" id="submitGuestRating" style="margin-top:10px;">${guest.rating ? 'Update My Rating' : 'Submit My Rating'}</button>
      ${guest.rating ? `<div class="muted" style="margin-top:8px;color:var(--green);">✓ Your rating has been shared with the group</div>` : ''}
    </div>
  `));
  const slider = document.getElementById('guestRatingSlider');
  slider.addEventListener('input', ()=>{
    document.getElementById('guestRatingBadge').textContent = slider.value;
    document.getElementById('guestRatingBadge').style.background = scoreColor(Number(slider.value));
    slider.style.setProperty('--pct', ((slider.value-1)/9*100)+'%');
  });
  document.getElementById('submitGuestRating').addEventListener('click', ()=>{
    guest.rating = Number(slider.value);
    save();
    render();
    toast('Thanks — your rating has been shared with the group');
  });
}
function renderGuestFlow(){
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('agentModeBtn').style.display = 'none';
  const nav = document.querySelector('.bottomnav');
  if(nav) nav.style.display = 'none';
  document.getElementById('fab').style.display = 'none';
  document.getElementById('pageTitle').textContent = 'Virtual Tour Guest';
  const main = document.getElementById('main');
  main.innerHTML = '';
  const found = (state.guestId && state.guestShowingId) ? findGuest(state.guestShowingId, state.guestId) : null;
  if(found){
    renderGuestTourStep(main, found.p, found.guest);
  } else {
    renderGuestJoinStep(main);
  }
}

/* ============ INIT ============ */
initGuestModeFromURL();
initDB();
setInterval(updateAllTimerBadges, 15000); // keep "time left" countdowns live without a full re-render
